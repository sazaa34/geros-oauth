<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GEROS — код подключения Gmail</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
    --code-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f;
      --card: #17181c;
      --text: #f2f2f3;
      --muted: #9aa0a6;
      --accent: #60a5fa;
      --border: #2a2b30;
      --code-bg: #1f2024;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 22px;
  }
  .code-box {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 14px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 15px;
    word-break: break-all;
    margin-bottom: 16px;
    min-height: 24px;
  }
  button {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button.copied { background: #16a34a; }
  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .error {
    color: #dc2626;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>GEROS · Gmail</h1>
    <p class="sub" id="subtitle">Ваш код готов — скопируйте и вставьте его в чат с ботом.</p>
    <div class="code-box" id="codeBox">…</div>
    <button id="copyBtn" onclick="copyCode()">Скопировать код</button>
    <p class="hint" id="hint">
      Вернитесь в Telegram, откройте чат с ботом GEROS и отправьте этот код следующим сообщением.
    </p>
  </div>

  <script>
    // This page's only job: Google redirects here after consent with
    // ?code=... in the URL - read it and show it, so the person can paste
    // it back into the bot. Nothing here talks to any server, there is no
    // backend, and no client secret is ever present on this page.
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const box = document.getElementById("codeBox");
    const btn = document.getElementById("copyBtn");
    const subtitle = document.getElementById("subtitle");
    const hint = document.getElementById("hint");

    if (error) {
      box.textContent = error;
      box.classList.add("error");
      subtitle.textContent = "Google отклонил запрос.";
      hint.textContent = "Вернитесь в Telegram и попробуйте подключить Gmail ещё раз.";
      btn.style.display = "none";
    } else if (code) {
      box.textContent = code;
    } else {
      box.textContent = "—";
      subtitle.textContent = "Код не найден на странице.";
      hint.textContent = "Откройте эту страницу через ссылку из бота GEROS, не напрямую.";
      btn.style.display = "none";
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = "Скопировано ✓";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Скопировать код"; btn.classList.remove("copied"); }, 2000);
      }).catch(() => {
        // Clipboard API unavailable (e.g. very old in-app browser) - the
        // code is already selectable text in the box above.
        const range = document.createRange();
        range.selectNode(box);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }
  </script>
</body>
</html>
